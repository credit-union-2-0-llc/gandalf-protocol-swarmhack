# Theater gate — blocks verification theater INTRODUCED by a change, never the
# backlog this repo already carries. Source: the public cu-agent-standards repo.
name: Theater gate

on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  theater:
    uses: credit-union-2-0-llc/cu-agent-standards/.github/workflows/reusable-theater.yml@main
    secrets:
      FORGE_BUILD_APP_ID: ${{ secrets.FORGE_BUILD_APP_ID }}
      FORGE_BUILD_PRIVATE_KEY: ${{ secrets.FORGE_BUILD_PRIVATE_KEY }}
