name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests + evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        # pytest is not in requirements.txt: until now every test file in CI was
        # invoked as `python test_x.py`, so nothing needed a runner.
        run: pip install -r requirements.txt 'pytest>=8,<10'

      # ── Deterministic guards — zero cost, run in MOCK, ALWAYS gate ──
      - name: Judge deterministic checks (#5)
        run: python test_signal.py

      - name: Training-persistence guard (#17)
        run: python test_training_persists.py

      - name: Gold-set structural guard (#13)
        run: python test_gold_set.py

      - name: ACE curation guard
        run: python test_ace_curation.py

      # test_best_of_n.py and test_judge_panel.py are pytest-style: they define
      # test functions and have no `if __name__ == "__main__"` block. Invoked as
      # `python test_judge_panel.py` -- the idiom every other test step here uses
      # -- they import cleanly, run nothing, and exit 0. That is a green step
      # covering zero assertions, so they get a real runner instead.
      - name: Best-of-N and judge-panel guards (pytest)
        run: python -m pytest test_best_of_n.py test_judge_panel.py -q

      # ── Eval report (informational) ──
      # Runs run_evals.py in MOCK: exercises the learning check and validates the
      # harness wiring on every push. The REAL judge gates (Cohen's κ, constraint,
      # canary) need live Claude calls — and per CU2 policy the gateway key is NOT
      # pasted in as a GitHub secret. It stays in Key Vault / the app's container
      # secret; calibration is run out-of-band (Jasper, or a managed-identity job
      # via azure/login that fetches the key at runtime — never copy-pasted).
      # continue-on-error so MOCK-only artifacts (e.g. the flat-curve canary) don't
      # red the build; the deterministic guards above are the real gate.
      - name: Eval report (mock, informational)
        continue-on-error: true  # theater-ok: MOCK-only artifacts may legitimately fail; the deterministic guards above are the real gate; this step is informational only
        run: python evals/run_evals.py
